<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1824">
<meta name="referrer" content="no-referrer">
<title>SIPS</title>
<link rel="stylesheet" href="./css/sips.css">
</head>
<body>
<header class="bar">
  <div class="wordmark" aria-label="SIPS">S<span>I</span>PS</div>
  <div class="bar-right"><span class="dot" aria-hidden="true">●</span> <span id="table">Tafel</span></div>
</header>
<main id="app" class="wrap" aria-live="polite"></main>
<button id="cartbar" class="cartbar" hidden></button>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="age" class="age" hidden>
  <div class="age-q">
    <div class="wordmark big">S<span>I</span>PS</div>
    <h2>Ben je 18 jaar of ouder?</h2>
    <p>Bij SIPS schenken we sterke drank, wijn en champagne. Bestellen kan alleen als je 18+ bent.</p>
    <div class="age-actions"><button class="btn gold" data-age="yes">Ja, ik ben 18+</button><button class="btn ghost" data-age="no">Nee</button></div>
  </div>
</div>
<noscript><p class="wrap">Zet JavaScript aan om te bestellen.</p></noscript>
<script type="module" src="./js/app.js"></script>
</body>
</html>
