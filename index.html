<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aan Tafel — bestelprototype</title>
<style>
:root{--bg:#f6f4ee;--paper:#fff;--ink:#213d32;--muted:#72796f;--line:#e5e7df;--accent:#d8ed8b;--green:#244b3b;--orange:#a76524}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a4c451;outline-offset:3px}header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:850;font-size:22px;letter-spacing:-1px}.brand span{color:#8eaa4e}.nav{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}.nav button{border:0;background:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700}.nav button.active{background:var(--green);color:white}.demo{padding:9px 5%;font-size:12px;background:#edf1e1;color:#526039;display:flex;justify-content:space-between;gap:10px}.demo button{border:0;background:none;color:inherit;text-decoration:underline;font-size:12px}.wrap{max-width:1240px;margin:auto;padding:32px 28px 100px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 345px;gap:34px;align-items:start}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}h1{font-size:42px;letter-spacing:-1.8px;line-height:1.12;margin:12px 0}h2{letter-spacing:-.5px}p{line-height:1.6}.hero{background:var(--green);color:white;border-radius:24px;padding:32px;position:relative;overflow:hidden;margin-bottom:26px}.hero p{color:#d7e1d6;max-width:430px;font-size:14px;margin-bottom:0}.hero .eyebrow{color:var(--accent)}.tabletag{display:inline-flex;align-items:center;gap:8px;font-size:12px;background:#ffffff18;border:1px solid #ffffff22;padding:7px 12px;border-radius:20px;margin-bottom:10px}.hero .decor{position:absolute;right:22px;bottom:12px;font-size:85px;opacity:.22;transform:rotate(-12deg)}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:24px 0 20px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;padding:10px 15px;border-radius:25px;color:var(--muted);font-size:13px}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}.search{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:white;min-width:0;width:190px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.product{background:white;border-radius:19px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}.picture{height:123px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#eef0e5,#e2e8d3);position:relative}.picture.warm{background:linear-gradient(135deg,#f8ebda,#eddbc7)}.picture.pink{background:linear-gradient(135deg,#f9e7e6,#ead4d1)}.badge{position:absolute;top:11px;left:11px;font-size:10px;font-weight:800;background:white;border-radius:20px;padding:5px 9px;color:var(--ink)}.productbody{padding:17px;flex:1;display:flex;flex-direction:column}.product h3{font-size:16px;margin:0 0 6px}.product p{font-size:12px;color:var(--muted);margin:0 0 16px;flex:1}.productfoot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}.add{border:0;background:var(--accent);width:34px;height:34px;border-radius:11px;font-size:22px;color:var(--ink)}.cart{position:sticky;top:20px;background:white;border:1px solid var(--line);border-radius:22px;padding:23px}.cart h2{margin:0 0 4px;font-size:21px}.small{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}.empty .icon{font-size:35px;margin-bottom:10px}.cartrow{padding:18px 0;border-bottom:1px solid var(--line)}.rowtop{display:flex;justify-content:space-between;gap:10px;font-size:13px}.rownote{font-size:11px;color:var(--muted);margin:5px 0}.quantity{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:12px}.quantity button{border:1px solid var(--line);background:var(--bg);border-radius:7px;width:27px;height:27px}.total{display:flex;justify-content:space-between;font-weight:850;font-size:19px;margin:22px 0 16px}.primary,.secondary{border:0;border-radius:12px;padding:14px 18px;font-weight:750;font-size:14px}.primary{background:var(--green);color:white}.secondary{background:#eef1e5;color:var(--ink)}.full{width:100%}.hint{text-align:center;font-size:11px;line-height:1.6;color:var(--muted);margin:12px 0 0}.mobilecart{display:none}.back{background:none;border:0;padding:0;color:var(--muted);font-size:13px;margin-bottom:24px}.checkout{max-width:600px;margin:0 auto}.box{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;margin:20px 0}.payoption{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);border-radius:15px;background:white;padding:18px;margin:12px 0}.payoption.selected{border-color:var(--green);background:#f2f6e9}.payoption .symbol{font-size:25px}.payoption strong{display:block;margin-bottom:6px}.payoption .small{line-height:1.6}.radio{margin-left:auto;border:2px solid #c6cec1;width:19px;height:19px;border-radius:50%;flex-shrink:0;margin-top:3px}.selected .radio{border:6px solid var(--green)}.checkout h1{font-size:34px}.statusicon{width:76px;height:76px;background:#e4edcf;border-radius:50%;display:grid;place-items:center;font-size:36px;margin:0 auto 20px}.success{text-align:center}.success h1{font-size:32px}.tracking{display:flex;justify-content:center;gap:14px;margin:24px 0;font-size:11px}.tracking span{padding:9px 12px;border-radius:20px;background:#edf0e8;color:var(--muted)}.tracking .active{background:var(--green);color:white}.adminhead{display:flex;justify-content:space-between;align-items:center;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:20px}.stat strong{display:block;font-size:27px;margin-top:7px}.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.order{border:1px solid var(--line);border-radius:18px;background:white;padding:20px}.order h3{margin:0;font-size:18px}.orderheader{display:flex;justify-content:space-between;align-items:center}.pill{font-size:10px;border-radius:20px;padding:6px 9px;background:#fff0d9;color:#895b29;font-weight:750}.pill.paid{background:#eaf2db;color:#3f642c}.orderitems{padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:15px 0;font-size:13px}.orderitems div{margin:8px 0}.orderactions{display:flex;flex-direction:column;gap:8px;margin-top:15px}.orderactions button{font-size:12px;padding:11px}.orderstatus{font-size:12px;font-weight:750;margin-top:10px}.overlay{position:fixed;inset:0;background:#15271ec0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:22px;width:100%;max-width:460px;padding:26px;max-height:90vh;overflow:auto;position:relative}.close{position:absolute;right:17px;top:17px;border:0;background:var(--bg);border-radius:50%;width:32px;height:32px;font-size:20px}.modal h2{margin:14px 0 6px}.modal textarea{width:100%;border:1px solid var(--line);border-radius:10px;resize:vertical;padding:12px;min-height:75px;margin:8px 0 18px}.modal label{font-size:13px;font-weight:700}.allergens{padding:12px;background:#f6f4ee;border-radius:10px;font-size:12px;line-height:1.6;margin:16px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 22px;border-radius:12px;font-size:13px;z-index:30;box-shadow:0 5px 30px #0002}.hidden{display:none!important}footer{margin-top:28px;font-size:11px;color:var(--muted);line-height:1.7}.inlineinfo{background:#f6f4ee;border-radius:10px;padding:12px;font-size:12px;line-height:1.6}.paymentchoice{display:flex;gap:10px;margin-top:16px}.paymentchoice button{flex:1}.orderlistempty{background:white;border:1px dashed #ccd4c5;border-radius:20px;padding:50px;text-align:center;grid-column:1/-1}.overview{font-size:12px;color:var(--muted);margin:8px 0}.checkoutitems{font-size:13px}.checkoutitems>div{display:flex;justify-content:space-between;margin:12px 0;gap:15px}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 300px;gap:20px}.orders{grid-template-columns:repeat(2,1fr)}.search{width:100%}}
@media(max-width:740px){header{padding:15px 18px}.brand{font-size:20px}.nav button{padding:9px 11px;font-size:12px}.wrap{padding:22px 16px 105px}.layout{display:block}.cart{display:none}.hero{padding:24px}.hero h1{font-size:34px}.hero .decor{font-size:60px;right:10px}.grid{gap:12px}.picture{height:104px;font-size:52px}.productbody{padding:13px}.product h3{font-size:14px}.product p{font-size:11px}.mobilecart{position:fixed;bottom:16px;left:16px;right:16px;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:17px 20px;box-shadow:0 8px 20px #244b3b33}.mobilecart.hidden{display:none}.stats{gap:8px}.stat{padding:14px 10px}.stat strong{font-size:22px}.stat .small{font-size:10px}.orders{grid-template-columns:1fr}.adminhead{align-items:flex-start}.adminhead h1{font-size:30px}.checkout h1{font-size:30px}.toast{bottom:85px;width:max-content;max-width:90%}.box{padding:20px}.demo{font-size:10px;padding:9px 18px}.tracking{gap:6px}.tracking span{padding:8px;font-size:10px}}
</style>
<link rel="stylesheet" href="./css/sips-theme.css">
</head>
<body>
<header><div class="brand">SIPS<span>●</span></div><nav class="nav" aria-label="Weergave"><button id="guestTab" class="active" onclick="setView('guest')">Gast</button><button id="staffTab" onclick="setView('staff')">Personeel <span id="orderCount"></span></button></nav></header>
<div class="demo"><span>✦ Klikbaar prototype · Tafel 12 · Geen echte betalingen</span><button onclick="resetDemo()">Demo resetten</button></div>
<main id="app" class="wrap"></main>
<div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const menu=[
{id:1,name:'Burrata & tomaat',description:'Romige burrata, kleurrijke tomaten, basilicum en zuurdesem.',price:12.5,category:'Eten',emoji:'🥗',tag:'Favoriet',color:'',allergens:'Melk, gluten (tarwe).',extra:{name:'Extra zuurdesem',price:2}},
{id:2,name:'Burger van het huis',description:'Rundvlees, cheddar, huisgemaakte saus en krokante friet.',price:18.5,category:'Eten',emoji:'🍔',tag:'Populair',color:'warm',allergens:'Gluten (tarwe), melk, ei, mosterd, sesam.',extra:{name:'Extra cheddar',price:1.5}},
{id:3,name:'Groene bowl',description:'Quinoa, avocado, geroosterde groenten en tahindressing.',price:15,category:'Eten',emoji:'🥑',tag:'Vegan',color:'',allergens:'Sesam.',extra:{name:'Extra avocado',price:2.5}},
{id:4,name:'Krokante frietjes',description:'Goudgeel gebakken, met huisgemaakte mayonaise.',price:5.5,category:'Eten',emoji:'🍟',tag:'',color:'warm',allergens:'Ei, mosterd (mayonaise).',extra:null},
{id:5,name:'Huisgemaakte limonade',description:'Citroen, verse munt en bruiswater. Lekker fris.',price:4.5,category:'Drinken',emoji:'🍋',tag:'Alcoholvrij',color:'',allergens:'Geen aangegeven allergenen.',extra:null},
{id:6,name:'Cappuccino',description:'Espresso met romig melkschuim.',price:3.8,category:'Drinken',emoji:'☕',tag:'',color:'warm',allergens:'Melk.',extra:{name:'Haverdrink in plaats van melk',price:.5,allergens:'Haver (mogelijk gluten); vraag personeel naar het gebruikte product.'}},
{id:7,name:'Bruiswater',description:'Een gekoeld flesje bruisend mineraalwater, 250 ml.',price:3,category:'Drinken',emoji:'💧',tag:'',color:'',allergens:'Geen aangegeven allergenen.',extra:null},
{id:8,name:'Chocolade brownie',description:'Warme chocoladebrownie met een bol vanille-ijs.',price:8,category:'Dessert',emoji:'🍫',tag:'Huisgemaakt',color:'pink',allergens:'Gluten (tarwe), ei, melk, soja. Kan noten bevatten.',extra:null}
];
let cart=[],orders=[],category='Alles',query='',view='guest',page='menu',method='online',lastOrder=null,seq=100,toastTimer;
const euro=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const total=()=>cart.reduce((a,i)=>a+i.unit*i.qty,0);const count=()=>cart.reduce((a,i)=>a+i.qty,0);
function notify(text){const t=document.getElementById('toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setView(v){closeModal();view=v;render()}
function render(){document.getElementById('guestTab').classList.toggle('active',view==='guest');document.getElementById('staffTab').classList.toggle('active',view==='staff');document.getElementById('orderCount').textContent=orders.length?'· '+orders.length:'';document.getElementById('app').innerHTML=view==='staff'?staffHTML():page==='checkout'?checkoutHTML():page==='success'?successHTML():menuHTML()}
function menuHTML(){return `<div class="layout"><section><div class="hero"><div class="tabletag">⌖ Brasserie Linden · Tafel 12</div><div class="eyebrow">Goed gezelschap. Goed eten.</div><h1>Waar heb je<br>zin in vandaag?</h1><p>Kies iets lekkers. Wij brengen het naar je tafel.<br>Betaal online of cash aan de kassa.</p><div class="decor" aria-hidden="true">🌿</div></div><div class="toolbar"><div class="tabs">${['Alles','Eten','Drinken','Dessert'].map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><input class="search" id="search" aria-label="Zoek in het menu" placeholder="⌕ Zoek iets lekkers…" value="${esc(query)}" oninput="query=this.value;renderProducts()"></div><div class="grid" id="products">${productsHTML()}</div><footer>Allergie? Bekijk de productinformatie en neem bij twijfel contact op met het personeel. Menu en allergenen zijn fictieve demogegevens.</footer></section><aside class="cart">${cartHTML()}</aside></div><button class="primary mobilecart ${count()?'':'hidden'}" onclick="openCart()"><span>Bekijk bestelling · ${count()} ${count()===1?'item':'items'}</span><strong>${euro(total())} →</strong></button>`}
function productsHTML(){const items=menu.filter(p=>(category==='Alles'||p.category===category)&&(p.name+' '+p.description).toLowerCase().includes(query.toLowerCase()));return items.length?items.map(p=>`<article class="product"><div class="picture ${p.color}">${p.tag?`<span class="badge">${p.tag}</span>`:''}<span aria-hidden="true">${p.emoji}</span></div><div class="productbody"><h3>${p.name}</h3><p>${p.description}</p><div class="productfoot"><span>${euro(p.price)}</span><button class="add" aria-label="${p.name} bekijken en toevoegen" onclick="openProduct(${p.id})">+</button></div></div></article>`).join(''):'<div class="empty">Geen gerechten gevonden. Probeer een andere zoekterm.</div>'}
function renderProducts(){document.getElementById('products').innerHTML=productsHTML()}
function cartHTML(){return `<h2>Jouw bestelling</h2><div class="small">Tafel 12 · Brasserie Linden</div>${!count()?'<div class="empty"><div class="icon">🍽️</div>Nog even kiezen?<br>Voeg iets lekkers toe uit het menu.</div>':cart.map((i,index)=>`<div class="cartrow"><div class="rowtop"><strong>${esc(i.name)}</strong><strong>${euro(i.unit*i.qty)}</strong></div>${i.extra?`<div class="rownote">+ ${esc(i.extra)}</div>`:''}${i.note?`<div class="rownote">Opmerking: ${esc(i.note)}</div>`:''}<div class="quantity"><button aria-label="Eén ${esc(i.name)} verwijderen" onclick="changeQty(${index},-1)">−</button><span>${i.qty}</span><button aria-label="Eén ${esc(i.name)} toevoegen" onclick="changeQty(${index},1)">+</button></div></div>`).join('')}<div class="total"><span>Totaal</span><span>${euro(total())}</span></div><button class="primary full" ${!count()?'disabled':''} onclick="goCheckout()">Verder naar betalen →</button><p class="hint">Prijzen inclusief btw.<br>Geen account nodig. Geen bestelkosten.</p>`}
function modal(html){const o=document.getElementById('overlay');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Bestelvenster"><button class="close" aria-label="Sluiten" onclick="closeModal()">×</button>${html}</div>`;o.classList.remove('hidden');o.querySelector('.close').focus()}
function closeModal(){document.getElementById('overlay').classList.add('hidden');document.getElementById('overlay').innerHTML=''}
function openProduct(id){const p=menu.find(x=>x.id===id);modal(`<div style="font-size:60px;text-align:center;margin:6px">${p.emoji}</div><h2>${p.name}</h2><p class="small">${p.description}</p><div class="allergens"><strong>Allergenen</strong><br>${p.allergens}${p.extra?.allergens?'<br>Optie: '+p.extra.allergens:''}<br>Bij een ernstige allergie: overleg altijd met het personeel.</div>${p.extra?`<label style="display:flex;gap:10px;align-items:center;margin:18px 0"><input type="checkbox" id="extra" onchange="document.getElementById('addPrice').textContent=euro(${p.price}+(this.checked?${p.extra.price}:0))">${p.extra.name} (+${euro(p.extra.price)})</label>`:''}<label for="note">Opmerking voor de keuken</label><textarea id="note" maxlength="180" placeholder="Bijvoorbeeld: zonder ui"></textarea><button class="primary full" onclick="addItem(${p.id})">Toevoegen · <span id="addPrice">${euro(p.price)}</span></button>`)}
function addItem(id){const p=menu.find(x=>x.id===id),extra=!!document.getElementById('extra')?.checked,note=document.getElementById('note').value.trim();const existing=cart.find(i=>i.id===id&&i.extra===(extra?p.extra.name:'')&&i.note===note);if(existing)existing.qty++;else cart.push({id,name:p.name,unit:p.price+(extra?p.extra.price:0),extra:extra?p.extra.name:'',note,qty:1});closeModal();render();notify(p.name+' toegevoegd')}
function changeQty(index,d){cart[index].qty+=d;if(cart[index].qty<=0)cart.splice(index,1);const cartOpen=!document.getElementById('overlay').classList.contains('hidden');render();if(cartOpen)openCart()}
function openCart(){modal(`<h2>Even nakijken</h2><div style="margin-top:20px">${cartHTML()}</div>`)}
function goCheckout(){if(!count())return;closeModal();page='checkout';render();window.scrollTo(0,0)}
function checkoutHTML(){return `<section class="checkout"><button class="back" onclick="page='menu';render()">← Terug naar het menu</button><div class="eyebrow">Nog één stap</div><h1>Hoe wil je betalen?</h1><p class="small">Je bestelling wordt naar tafel 12 gebracht.</p><div class="box"><h3 style="margin:0 0 15px">Jouw bestelling <span class="small">· ${count()} items</span></h3><div class="checkoutitems">${cart.map(i=>`<div><span>${i.qty} × ${esc(i.name)}${i.extra?'<br><span class="small">'+esc(i.extra)+'</span>':''}${i.note?'<br><span class="small">'+esc(i.note)+'</span>':''}</span><strong>${euro(i.unit*i.qty)}</strong></div>`).join('')}</div><div class="total" style="border-top:1px solid var(--line);padding-top:18px;margin-bottom:0"><span>Totaal incl. btw</span><span>${euro(total())}</span></div></div><button class="payoption ${method==='online'?'selected':''}" aria-pressed="${method==='online'}" onclick="method='online';render()"><span class="symbol">💳</span><span><strong>Meteen online betalen</strong><span class="small">In het echte systeem via een betaalprovider.<br>Hier testen we de betaling met een simulatie.</span></span><span class="radio"></span></button><button class="payoption ${method==='cash'?'selected':''}" aria-pressed="${method==='cash'}" onclick="method='cash';render()"><span class="symbol">💶</span><span><strong>Cash aan de kassa</strong><span class="small">Bestel nu, betaal bij het personeel.<br>Het personeel bevestigt je bestelling eerst.</span></span><span class="radio"></span></button><button class="primary full" style="margin-top:14px" onclick="submitOrder()">${method==='online'?'Naar demo-betaling':'Bestelling plaatsen'} · ${euro(total())} →</button><p class="hint">Dit is een prototype. Er wordt geen geld afgeschreven.</p></section>`}
function submitOrder(){if(!count())return;if(method==='cash'){placeOrder(false);return}modal(`<div style="font-size:44px;text-align:center;margin:12px">💳</div><h2>Demo-betaalvenster</h2><p class="small">Geen bankverbinding of echte transactie. Kies een uitkomst om de bestelroute te testen.</p><div class="total"><span>Te betalen</span><span>${euro(total())}</span></div><div class="inlineinfo">Bij een geslaagde demo-betaling verschijnt je bestelling als betaald op het personeelsscherm.</div><div class="paymentchoice"><button class="secondary" onclick="closeModal();notify('Betaling mislukt. Je winkelmand blijft bewaard.')">Mislukt</button><button class="primary" onclick="placeOrder(true)">Geslaagd ✓</button></div>`)}
function placeOrder(paid){if(!count())return;const o={id:++seq,table:12,items:cart.map(i=>({...i})),total:total(),paid,method:paid?'online':'cash',status:paid?'ontvangen':'wacht',time:new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})};orders.unshift(o);lastOrder=o.id;cart=[];page='success';closeModal();render();window.scrollTo(0,0)}
function successHTML(){const o=orders.find(x=>x.id===lastOrder);if(!o){page='menu';return menuHTML()}const statusLabels={wacht:'Wacht op bevestiging',ontvangen:'Bestelling ontvangen',bereiding:'In bereiding',klaar:'Klaar om te serveren',geserveerd:'Geserveerd'};return `<section class="checkout success"><div class="statusicon">${o.status==='wacht'?'⌛':'✓'}</div><div class="eyebrow">Bestelling #${o.id} · Tafel 12</div><h1>${o.status==='wacht'?'Je bestelling is verstuurd.':'Bedankt, lekker gekozen!'}</h1><p class="small">${o.status==='wacht'?'Het personeel kijkt je bestelling na en bevestigt deze.':'Je bestelling staat op het personeelsscherm.'}</p><div class="box"><div class="pill ${o.paid?'paid':''}" style="display:inline-block">${o.paid?'Betaald · '+(o.method==='online'?'online (demo)':'cash (demo)'):'Nog te betalen · cash aan de kassa'}</div><h2>${euro(o.total)}</h2><div class="checkoutitems" style="text-align:left">${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.name)}</span><strong>${euro(i.unit*i.qty)}</strong></div>`).join('')}</div><div class="tracking"><span class="${['wacht','ontvangen'].includes(o.status)?'active':''}">${o.status==='wacht'?'Bevestiging':'Ontvangen'}</span><span class="${o.status==='bereiding'?'active':''}">In bereiding</span><span class="${['klaar','geserveerd'].includes(o.status)?'active':''}">${o.status==='geserveerd'?'Geserveerd':'Klaar'}</span></div><strong style="font-size:14px">${statusLabels[o.status]}</strong>${!o.paid?'<p class="small">Betaal deze bestelling cash bij de kassa. Geef je tafelnummer en bestelnummer door.</p>':''}</div><button class="primary full" onclick="page='menu';render()">Nog iets bestellen →</button><button class="secondary full" style="margin-top:10px" onclick="setView('staff')">Bekijk de bestelling als personeel</button><p class="hint">Nieuwe bestellingen worden apart afgerekend.</p></section>`}
function staffHTML(){const open=orders.filter(o=>!(o.paid&&o.status==='geserveerd')),unpaid=orders.filter(o=>!o.paid).reduce((a,o)=>a+o.total,0),received=orders.filter(o=>o.paid).reduce((a,o)=>a+o.total,0);return `<div class="adminhead"><div><div class="eyebrow">Brasserie Linden · Live demo</div><h1>Bestellingen</h1><p class="small">Van de tafel naar de keuken, zonder omwegen.</p></div><span class="pill paid">● Demo actief</span></div><div class="inlineinfo">Test de route via <strong>Gast</strong>. Cashbestellingen moeten eerst worden geaccepteerd; online betaalde bestellingen zijn meteen ontvangen. Hier kun je vervolgens bereiden, serveren en cashbetaling registreren.</div><div class="stats"><div class="stat"><span class="small">Open bestellingen</span><strong>${open.length}</strong></div><div class="stat"><span class="small">Nog te betalen</span><strong>${euro(unpaid)}</strong></div><div class="stat"><span class="small">Ontvangen (demo)</span><strong>${euro(received)}</strong></div></div><div class="orders">${orders.length?orders.map(o=>orderHTML(o)).join(''):'<div class="orderlistempty"><div style="font-size:40px">🍽️</div><h3>De eerste bestelling komt zo.</h3><p class="small">Plaats een bestelling in de gastweergave om het hele proces te testen.</p><button class="primary" onclick="setView(\'guest\')">Naar het menu →</button></div>'}</div><footer>Dit scherm is openbaar binnen de demo. Een echte versie vereist personeelslogin, toegangscontrole, betrouwbare opslag en servergestuurde betaalbevestigingen. Gegevens blijven alleen in deze demosessie bewaard.</footer>`}
function orderHTML(o){const labels={wacht:'Wacht op acceptatie',ontvangen:'Ontvangen',bereiding:'In bereiding',klaar:'Klaar om te serveren',geserveerd:'Geserveerd'},next={wacht:['Accepteer bestelling','ontvangen'],ontvangen:['Start bereiding','bereiding'],bereiding:['Markeer als klaar','klaar'],klaar:['Markeer als geserveerd','geserveerd']};return `<article class="order"><div class="orderheader"><h3>Tafel ${o.table}</h3><span class="pill ${o.paid?'paid':''}">${o.paid?'Betaald':'Onbetaald'}</span></div><div class="overview">#${o.id} · ${o.time} · ${o.method==='online'?'Online (demo)':'Cash'}</div><div class="orderstatus">● ${labels[o.status]}</div><div class="orderitems">${o.items.map(i=>`<div><strong>${i.qty} × ${esc(i.name)}</strong>${i.extra?'<div class="small">+ '+esc(i.extra)+'</div>':''}${i.note?'<div class="small">Opmerking: '+esc(i.note)+'</div>':''}</div>`).join('')}</div><div class="rowtop"><strong>Totaal</strong><strong>${euro(o.total)}</strong></div><div class="orderactions">${next[o.status]?`<button class="primary" onclick="advance(${o.id},'${next[o.status][1]}')">${next[o.status][0]}</button>`:'<div class="small">✓ Geserveerd'+(o.paid?' en betaald':' · betaling nog open')+'</div>'}${!o.paid?`<button class="secondary" onclick="cashModal(${o.id})">Cashbetaling registreren</button>`:''}</div></article>`}
function advance(id,status){orders.find(o=>o.id===id).status=status;render();notify('Bestelstatus bijgewerkt')}
function cashModal(id){const o=orders.find(x=>x.id===id);modal(`<h2>Cash ontvangen?</h2><p class="small">Bestelling #${o.id} · Tafel ${o.table}</p><div class="total"><span>Te ontvangen</span><span>${euro(o.total)}</span></div><div class="inlineinfo">Registreer de betaling alleen nadat je het geld daadwerkelijk hebt ontvangen. In dit prototype is ook deze registratie een simulatie.</div><button class="primary full" style="margin-top:20px" onclick="markCash(${id})">Bevestig cash ontvangen (demo)</button>`)}
function markCash(id){orders.find(o=>o.id===id).paid=true;closeModal();render();notify('Cashbetaling geregistreerd (demo)')}
function resetDemo(){modal('<h2>Demo opnieuw beginnen?</h2><p class="small">Je winkelmand en alle demobestellingen worden verwijderd.</p><button class="primary full" onclick="confirmReset()">Reset demo</button>')}
function confirmReset(){cart=[];orders=[];category='Alles';query='';page='menu';view='guest';lastOrder=null;seq=100;closeModal();render();notify('Demo is gereset')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
<script type="module" src="./js/live-guest.js"></script>
</body>
</html>
