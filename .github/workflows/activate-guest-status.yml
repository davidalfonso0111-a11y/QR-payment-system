name: Activate guest order status
on:
  push:
    paths:
      - '.github/workflows/activate-guest-status.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: activate-guest-status
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch guest status integration safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('js/guest-api.js')
          live = Path('js/live-guest.js')
          a = api.read_text()
          b = live.read_text()
          def replace_once(text, old, new):
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise RuntimeError('Source changed: expected exactly one integration anchor; no files overwritten')
              return text.replace(old, new, 1)
          a = replace_once(a,
              "    // Keep the pending request if storage cleanup fails. Retrying will replay it.",
              "    // Preserve the private receipt BEFORE clearing the retry request.\n    try {\n      localStorage.setItem('qr-payment:receipt:v1:' + token, JSON.stringify({receipt: result, secret: body.p_guest_secret}));\n    } catch {\n      throw new GuestApiError('Bestelling opgeslagen, maar bevestiging kon niet worden bewaard. Herhaal dezelfde aanvraag.', {uncertain: true});\n    }\n    // Keep the pending request if storage cleanup fails. Retrying will replay it.")
          b = replace_once(b,
              "const baseRender = window.render;",
              "import {loadReceipt,startTracking,stopTracking} from './guest-status.js';\nconst baseRender = window.render;")
          b = replace_once(b,
              'receipt=null;page=\'menu\';window.render();',
              'stopTracking();receipt=null;page=\'menu\';window.render();')
          b = replace_once(b,
              'if(receipt){app.innerHTML=receiptHTML();return;}',
              "if(receipt){app.innerHTML=receiptHTML();startTracking(receipt,token,updated=>{receipt=updated;window.render();});return;}")
          b = replace_once(b,
              'Dit is de status bij de laatste databasebevestiging, geen live opvolging. Geef je tafelnummer en bestelnummer door aan het personeel.',
              '<span id="guest-status-message" role="status" aria-live="polite">Actuele status wordt opgehaald…</span> Geef je tafelnummer en bestelnummer door aan het personeel.')
          b = replace_once(b,
              'pending=hasPendingCashOrder(token);window.render();',
              'pending=hasPendingCashOrder(token);receipt=pending?null:loadReceipt(token);window.render();')
          module = r'''/* Private guest receipt tracking. Never put the secret in URLs or logs.
          Development use: gateway/IP rate limiting required before public pilot. */
          const URL='https://irzbdxffwcykwdynqvhg.supabase.co';
          const KEY='sb_publishable_pkzvobApP2voeO82K3TRKQ_f5gzdg14';
          const PREFIX='qr-payment:receipt:v1:';
          const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          let session=null,timer=null,controller=null,message='Actuele status wordt opgehaald…';
          function stored(token){
            try{
              const value=JSON.parse(localStorage.getItem(PREFIX+token));
              if(!UUID.test(value?.receipt?.id||'') || !/^[0-9a-f]{64}$/.test(value?.secret||''))return null;
              return value;
            }catch{return null;}
          }
          export function loadReceipt(token){return stored(token)?.receipt||null;}
          function show(){const el=document.getElementById('guest-status-message');if(el)el.textContent=message;}
          export function stopTracking(){
            session=null;clearTimeout(timer);timer=null;controller?.abort();controller=null;
          }
          function schedule(s,delay){
            clearTimeout(timer);
            if(session===s&&!document.hidden&&!s.denied)timer=setTimeout(()=>poll(s),delay);
          }
          export function startTracking(receipt,token,onUpdate){
            if(session?.id===receipt.id&&session.token===token){session.onUpdate=onUpdate;show();return;}
            stopTracking();
            const value=stored(token);
            if(!value||value.receipt.id!==receipt.id){message='Automatische opvolging niet beschikbaar op dit apparaat. Vraag het personeel om de status.';show();return;}
            session={id:receipt.id,token,secret:value.secret,receipt,onUpdate,failures:0,busy:false,denied:false};
            message='Actuele status wordt opgehaald…';show();
            if(!document.hidden)void poll(session);
          }
          async function poll(s){
            if(session!==s||s.busy||s.denied||document.hidden)return;
            s.busy=true;
            const c=new AbortController();controller=c;
            const timeout=setTimeout(()=>c.abort(),15000);
            let delay=10000;
            try{
              const response=await fetch(URL+'/rest/v1/rpc/qr_guest_order_status',{
                method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
                body:JSON.stringify({p_order_id:s.id,p_guest_secret:s.secret}),
                cache:'no-store',signal:c.signal
              });
              if(session!==s)return;
              if(!response.ok){
                if([400,401,403,404].includes(response.status)){
                  s.denied=true;message='Status niet beschikbaar. Vraag het personeel om hulp; bestel niet opnieuw.';show();return;
                }
                throw new Error('Temporary status failure');
              }
              const result=await response.json();
              if(result?.id!==s.id||typeof result.status!=='string'||typeof result.payment_status!=='string'||!Number.isInteger(result.total_cents))throw new Error('Invalid receipt');
              s.failures=0;
              message='Laatst gecontroleerd om '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'.';
              const updated={...s.receipt,...result};
              const changed=JSON.stringify(updated)!==JSON.stringify(s.receipt);
              s.receipt=updated;
              // Do not overwrite a newer order placed in another browser tab.
              try{if(stored(s.token)?.receipt.id===s.id)localStorage.setItem(PREFIX+s.token,JSON.stringify({receipt:updated,secret:s.secret}));}catch{}
              if(changed)s.onUpdate(updated);
              show();
            }catch{
              if(session!==s)return;
              s.failures++;
              delay=Math.min(60000,10000*2**Math.min(s.failures,3));
              message='Status tijdelijk niet bereikbaar. Laatst bekende status blijft staan; we proberen opnieuw. Plaats geen nieuwe bestelling als herhaling.';show();
            }finally{
              clearTimeout(timeout);if(controller===c)controller=null;s.busy=false;
              if(session===s)schedule(s,delay);
            }
          }
          document.addEventListener('visibilitychange',()=>{
            clearTimeout(timer);
            if(document.hidden){controller?.abort();return;}
            if(session&&!session.denied)schedule(session,250);
          });
          window.addEventListener('online',()=>{if(session&&!document.hidden)schedule(session,250);});
          '''
          # Write only after all integration anchors have passed validation.
          api.write_text(a)
          live.write_text(b)
          Path('js/guest-status.js').write_text(module)
          PY
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < js/guest-api.js
          node --input-type=module --check < js/live-guest.js
          node --input-type=module --check < js/guest-status.js
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/guest-api.js js/live-guest.js js/guest-status.js
          if ! git diff --cached --quiet; then
            git commit -m 'Enable private guest order tracking and receipt recovery'
            git push origin HEAD:main
          fi
